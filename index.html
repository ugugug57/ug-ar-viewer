<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR 掃描圖卡檢視器</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/three@0.137.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://unpkg.com/three@0.137.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { font-family: -apple-system, sans-serif; background-color: #121212; margin: 0; overflow: hidden; }
        
        .controls-card {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 90%; max-width: 400px;
            z-index: 9999; max-height: 90vh; overflow-y: auto;
        }

        .section-title { font-weight: bold; color: #333; font-size: 14px; margin-top: 10px; margin-bottom: 5px; border-bottom: 2px solid #007aff; padding-bottom: 3px; display: inline-block;}
        select, input[type="file"], button { width: 100%; padding: 10px; margin: 4px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        
        .btn-ar { background-color: #007aff; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; padding: 12px; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
        .btn-upload { background-color: #34c759; color: white; border: none; font-weight: bold; cursor: pointer; }
        .status { font-size: 13px; color: #d32f2f; margin-top: 8px; text-align: center; font-weight: bold; }
        
        .preview-container { text-align: center; margin-top: 5px; background: #eee; padding: 10px; border-radius: 8px; }
        #previewImg { max-width: 100%; max-height: 120px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .preview-hint { font-size: 11px; color: #666; margin-top: 4px; }

        #exitBtn {
            position: fixed; top: 20px; right: 20px; z-index: 10000;
            background: #ff3b30; color: white; border: none; padding: 10px 15px;
            border-radius: 20px; font-weight: bold; display: none; cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 59, 48, 0.4);
        }
    </style>
</head>
<body>

    <button id="exitBtn">✖ 退出 AR</button>

    <div class="controls-card" id="mainCard">
        <div style="font-weight:bold; text-align:center; font-size:16px; margin-bottom:10px;">WebAR 掃描圖卡系統</div>
        
        <div class="section-title">1. 設定 3D 模型 (.glb, .stl)</div>
        <select id="fileSelect">
            <option value="">-- 載入雲端列表中... --</option>
        </select>
        <input type="file" id="glbUpload" accept=".glb,.stl" style="margin-top:8px;">
        <button id="uploadBtn" class="btn-upload">上傳新模型</button>
        <div id="modelStatus" style="font-size:12px; color:green; text-align:center; margin-top:4px;"></div>

        <hr style="border:0; border-top:1px solid #ddd; margin: 15px 0;">

        <div class="section-title">2. 設定要掃描的「偵測圖」</div>
        <input type="file" id="targetUpload" accept="image/png, image/jpeg">
        <div class="preview-container">
            <img id="previewImg" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" crossorigin="anonymous">
            <div class="preview-hint">請用鏡頭掃描這張圖，模型將出現在圖面上</div>
        </div>

        <button id="startCamBtn" class="btn-ar">
            📷 編譯圖卡並啟動 AR
        </button>
        <div id="status" class="status">請先設定模型與圖卡</div>
    </div>

    <div id="ar-container" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index:1;"></div>

    <script>
        // ⚠️ 請保留您的 GAS API 網址
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxrcepwMRmGzdAA2X3PG8Mt7ctrhMgnXvKWmhPgP3zx-vQUUqk7_NxDmsIfm9LALZht/exec";

        const fileSelect = document.getElementById('fileSelect');
        const glbUpload = document.getElementById('glbUpload');
        const uploadBtn = document.getElementById('uploadBtn');
        const targetUpload = document.getElementById('targetUpload');
        const previewImg = document.getElementById('previewImg');
        const startCamBtn = document.getElementById('startCamBtn');
        const statusDiv = document.getElementById('status');
        const modelStatus = document.getElementById('modelStatus');
        const mainCard = document.getElementById('mainCard');
        const arContainer = document.getElementById('ar-container');
        const exitBtn = document.getElementById('exitBtn');

        let currentModelBlobUrl = null;
        let targetImageUrl = previewImg.src;

        window.onload = fetchFiles;

        async function fetchFiles() {
            try {
                const res = await fetch(`${GAS_API_URL}?action=getFiles`);
                const data = await res.json();
                if (data.success) {
                    fileSelect.innerHTML = '<option value="">-- 請選擇模型 --</option>';
                    data.files.forEach(file => {
                        const option = document.createElement('option');
                        option.value = file.id;
                        option.textContent = file.name;
                        fileSelect.appendChild(option);
                    });
                    statusDiv.textContent = "系統就緒，請設定模型與圖卡";
                    statusDiv.style.color = "green";
                }
            } catch (err) {
                statusDiv.textContent = '無法連線至雲端資料庫。';
            }
        }

        fileSelect.addEventListener('change', async (e) => {
            const fileId = e.target.value;
            if (fileId) {
                modelStatus.textContent = '從雲端下載模型中...';
                try {
                    const res = await fetch(`${GAS_API_URL}?action=getFileData&fileId=${fileId}`);
                    const data = await res.json();
                    if (data.success) {
                        loadModelFromBase64(data.base64, data.name);
                    }
                } catch(err) {
                    modelStatus.textContent = '下載連線發生錯誤。';
                }
            }
        });

        uploadBtn.addEventListener('click', () => {
            const file = glbUpload.files[0];
            if (!file) { alert("請先選擇要上傳的模型檔案！"); return; }
            modelStatus.textContent = '模型上傳中...';
            uploadBtn.disabled = true;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Data = reader.result.split(',')[1];
                try {
                    const res = await fetch(GAS_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "uploadFile", base64Data: base64Data, fileName: file.name, mimeType: file.type })
                    });
                    const data = await res.json();
                    if (data.success) {
                        loadModelFromBase64(base64Data, file.name);
                        fetchFiles();
                    }
                } catch(err) {
                    modelStatus.textContent = '上傳失敗。';
                } finally {
                    uploadBtn.disabled = false;
                }
            };
        });

        async function loadModelFromBase64(base64Data, filename) {
            modelStatus.textContent = '解析模型中...';
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
            const byteArray = new Uint8Array(byteNumbers);
            let blob;

            if (filename.toLowerCase().endsWith('.stl')) {
                blob = await new Promise((resolve) => {
                    const loader = new THREE.STLLoader();
                    const geometry = loader.parse(byteArray.buffer);
                    const material = new THREE.MeshStandardMaterial({ color: 0x909090, roughness: 0.5 });
                    const mesh = new THREE.Mesh(geometry, material);
                    const scene = new THREE.Scene();
                    scene.add(mesh);
                    const exporter = new THREE.GLTFExporter();
                    exporter.parse(scene, function (gltf) {
                        resolve(new Blob([gltf], { type: 'model/gltf-binary' }));
                    }, { binary: true });
                });
            } else {
                blob = new Blob([byteArray], {type: 'model/gltf-binary'});
            }

            if (currentModelBlobUrl) URL.revokeObjectURL(currentModelBlobUrl);
            currentModelBlobUrl = URL.createObjectURL(blob);
            modelStatus.textContent = '✅ 模型準備就緒！';
        }

        targetUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                targetImageUrl = URL.createObjectURL(file);
                previewImg.src = targetImageUrl;
                previewImg.removeAttribute("crossorigin");
            }
        });

        // ==========================================
        // 核心修正：自動壓縮圖片，防止手機記憶體爆炸
        // ==========================================
        async function compileImageToMind(imageUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                if (imageUrl.startsWith('http')) img.crossOrigin = "anonymous";
                
                img.onload = async () => {
                    try {
                        // 1. 設定最大尺寸 (800px 足以讓 AR 精準追蹤)
                        const MAX_DIM = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_DIM) {
                                height *= MAX_DIM / width;
                                width = MAX_DIM;
                            }
                        } else {
                            if (height > MAX_DIM) {
                                width *= MAX_DIM / height;
                                height = MAX_DIM;
                            }
                        }

                        // 2. 使用 Canvas 繪製壓縮後的圖片
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // 3. 將壓縮後的圖片餵給編譯器
                        const resizedImg = new Image();
                        resizedImg.onload = async () => {
                            const compiler = new MINDAR.IMAGE.Compiler();
                            await compiler.compileImageTargets([resizedImg]);
                            const exportedData = compiler.exportData();
                            const blob = new Blob([exportedData], { type: 'application/octet-stream' });
                            resolve(URL.createObjectURL(blob));
                        };
                        resizedImg.src = canvas.toDataURL('image/jpeg', 0.8);

                    } catch (err) {
                        reject(err);
                    }
                };
                img.onerror = () => reject("圖片載入失敗");
                img.src = imageUrl;
            });
        }

        startCamBtn.addEventListener('click', async () => {
            if (!currentModelBlobUrl) {
                alert('請先選擇或上傳一個 3D 模型！');
                return;
            }

            statusDiv.style.color = "#007aff";
            statusDiv.textContent = '正在利用 AI 演算法編譯偵測圖，請稍候...';
            startCamBtn.disabled = true;

            try {
                // 編譯圖卡 (現在有自動壓縮，速度會快很多)
                const mindUrl = await compileImageToMind(targetImageUrl);
                
                mainCard.style.display = 'none';
                exitBtn.style.display = 'block';

                arContainer.innerHTML = `
                    <a-scene mindar-image="imageTargetSrc: ${mindUrl}; autoStart: true; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
                        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                        <a-entity mindar-image-target="targetIndex: 0">
                            <!-- 模型預設顯示在圖卡中心 -->
                            <a-gltf-model src="${currentModelBlobUrl}" position="0 0 0.1" scale="1 1 1" rotation="0 0 0"></a-gltf-model>
                        </a-entity>
                    </a-scene>
                `;
            } catch (err) {
                statusDiv.style.color = "red";
                statusDiv.textContent = '圖卡編譯失敗，請換一張圖片。';
                startCamBtn.disabled = false;
                console.error(err);
            }
        });

        exitBtn.addEventListener('click', () => {
            window.location.reload();
        });
    </script>
</body>
</html>

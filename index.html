<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR 真實平面偵測</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

    <style>
        body { font-family: sans-serif; background-color: #121212; margin: 0; overflow: hidden; }
        
        /* 1. 將控制卡片稍微往下移，留出頂部空間給 AR 按鈕 */
        .controls-card { 
            position: absolute; 
            top: 80px; /* 原本是 10px，改為 80px 往下移 */
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(255, 255, 255, 0.95); 
            padding: 12px 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
            width: 90%; 
            max-width: 450px; 
            z-index: 9999; 
        }
        
        select, input[type="file"], button { width: 100%; padding: 10px; margin: 4px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        .btn-upload { background-color: #34c759; color: white; border: none; font-weight: bold; cursor: pointer; }
        .status { font-size: 12px; color: #666; margin-top: 4px; text-align: center; }
        
        /* 2. 【關鍵】強制將 A-Frame 內建的 AR 按鈕移到右上角，並稍微放大 */
        .a-enter-vr { 
            top: 20px !important; 
            bottom: auto !important; 
            right: 20px !important; 
            z-index: 10000 !important;
            transform: scale(1.3); /* 將按鈕放大 1.3 倍，更容易點擊 */
            transform-origin: top right;
        }
    </style>
</head>
<body>

    <div class="controls-card" id="mainCard">
        <div style="font-weight:bold; text-align:center; margin-bottom:6px;">WebAR 實境檢視器 (真實平面偵測)</div>
        
        <div style="font-size: 13px; font-weight: bold; color: #333;">📂 1. 選取雲端模型：</div>
        <select id="fileSelect">
            <option value="">-- 載入列表中... --</option>
        </select>

        <div style="font-size: 13px; font-weight: bold; color: #333; margin-top:8px;">☁️ 2. 上傳模型 (.glb, .stl)：</div>
        <input type="file" id="glbUpload" accept=".glb,.stl">
        <button id="uploadBtn" class="btn-upload">上傳並載入</button>

        <div id="status" class="status">正在檢查系統連線...</div>
        
        <!-- 給使用者的 AR 提示改為右上角 -->
        <div style="font-size: 11px; color: #d32f2f; margin-top: 10px; text-align: center;">
            ⚠️ 載入模型後，請點擊畫面<b>「右上角」</b>的 AR 按鈕<br>
            (平面偵測功能目前僅支援 Android Chrome)
        </div>
    </div>

    <!-- 
      A-Frame WebXR 場景設定 
      webxr="optionalFeatures: hit-test;" 這是啟動平面偵測的關鍵！
    -->
    <a-scene webxr="optionalFeatures: hit-test;" ar-hit-test="target: #arModel;" renderer="colorManagement: true;">
        <a-assets id="assets-container"></a-assets>
        
        <!-- 環境光與平行光 -->
        <a-entity light="type: ambient; intensity: 1.0;"></a-entity>
        <a-entity light="type: directional; intensity: 0.8;" position="-1 2 1"></a-entity>

        <!-- 平面準星 (Reticle) -->
        <a-entity id="reticle" visible="false">
            <a-ring color="cyan" radius-inner="0.1" radius-outer="0.15" rotation="-90 0 0"></a-ring>
        </a-entity>

        <!-- 我們的 3D 模型 -->
        <a-entity id="arModel" scale="1 1 1" visible="false"></a-entity>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // ⚠️ 請保留您的 GAS API 網址
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxbCkcJYozNf2uJWRs7kB1FzmlCpPttHPTSbJvOLqMvLqwRpJ2HSAq-bqHtERBbSw8QAw/exec";

        const fileSelect = document.getElementById('fileSelect');
        const glbUpload = document.getElementById('glbUpload');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusDiv = document.getElementById('status');
        const arModel = document.getElementById('arModel');
        const reticle = document.getElementById('reticle');
        const sceneEl = document.querySelector('a-scene');
        const mainCard = document.getElementById('mainCard');

        let currentBlobUrl = null;
        let modelLoaded = false;

        window.onload = function() {
            fetchFiles();
        };

        async function fetchFiles() {
            try {
                const res = await fetch(`${GAS_API_URL}?action=getFiles`);
                const data = await res.json();
                if (data.success) {
                    populateDropdown(data.files);
                    statusDiv.innerHTML = '<span style="color:green; font-weight:bold;">連線成功！請選擇模型。</span>';
                }
            } catch (err) {
                statusDiv.innerHTML = '<span style="color:red;">連線失敗。</span>';
            }
        }

        function populateDropdown(files) {
            fileSelect.innerHTML = '<option value="">-- 請選擇模型 --</option>';
            if (Array.isArray(files) && files.length > 0) {
                files.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file.id;
                    option.textContent = file.name;
                    fileSelect.appendChild(option);
                });
            }
        }

        // WebXR Hit Test 邏輯
        sceneEl.addEventListener('enter-vr', function () {
            if (sceneEl.is('ar-mode')) {
                mainCard.style.display = 'none'; // 隱藏面板
                sceneEl.addEventListener('ar-hit-test-start', function () {
                    reticle.setAttribute('visible', 'true');
                });
                sceneEl.addEventListener('ar-hit-test-achieved', function () {
                    reticle.setAttribute('visible', 'true');
                });
                sceneEl.addEventListener('ar-hit-test-lost', function () {
                    reticle.setAttribute('visible', 'false');
                });
            }
        });

        sceneEl.addEventListener('exit-vr', function () {
            mainCard.style.display = 'block'; // 離開AR後顯示面板
            reticle.setAttribute('visible', 'false');
            arModel.setAttribute('visible', 'false');
        });

        sceneEl.addEventListener('click', function () {
            if (sceneEl.is('ar-mode') && reticle.getAttribute('visible') === true && modelLoaded) {
                arModel.setAttribute('position', reticle.getAttribute('position'));
                arModel.setAttribute('visible', 'true');
            }
        });

        function convertStlToGlbBlob(arrayBuffer) {
            return new Promise((resolve, reject) => {
                try {
                    const loader = new THREE.STLLoader();
                    const geometry = loader.parse(arrayBuffer);
                    const material = new THREE.MeshStandardMaterial({ color: 0x909090, roughness: 0.5 });
                    const mesh = new THREE.Mesh(geometry, material);
                    const scene = new THREE.Scene();
                    scene.add(mesh);
                    const exporter = new THREE.GLTFExporter();
                    exporter.parse(scene, function (gltf) {
                        const blob = new Blob([gltf], { type: 'model/gltf-binary' });
                        resolve(blob);
                    }, { binary: true });
                } catch (e) {
                    reject(e);
                }
            });
        }

        async function loadModelFromBase64(base64Data, filename) {
            statusDiv.textContent = '解析並載入模型中...';
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            
            let blob;
            if (filename.toLowerCase().endsWith('.stl')) {
                blob = await convertStlToGlbBlob(byteArray.buffer);
            } else {
                blob = new Blob([byteArray], {type: 'model/gltf-binary'});
            }

            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            currentBlobUrl = URL.createObjectURL(blob);

            arModel.removeAttribute('gltf-model');
            arModel.setAttribute('gltf-model', currentBlobUrl);
            modelLoaded = true;
            
            statusDiv.innerHTML = '<span style="color:#007aff; font-weight:bold;">模型載入完成！<br>請點擊右上角「AR」按鈕進入平面偵測。</span>';
        }

        fileSelect.addEventListener('change', async (e) => {
            const fileId = e.target.value;
            if (fileId) {
                statusDiv.textContent = '下載模型中，請稍候...';
                modelLoaded = false;
                try {
                    const res = await fetch(`${GAS_API_URL}?action=getFileData&fileId=${fileId}`);
                    const data = await res.json();
                    if (data.success) {
                        loadModelFromBase64(data.base64, data.name);
                    }
                } catch(err) {
                    statusDiv.textContent = '下載連線發生錯誤。';
                }
            }
        });

        uploadBtn.addEventListener('click', () => {
            const file = glbUpload.files[0];
            if (!file) {
                alert("請先選擇要上傳的檔案！");
                return;
            }

            statusDiv.textContent = '檔案上傳中...';
            uploadBtn.disabled = true;
            modelLoaded = false;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Data = reader.result.split(',')[1];
                try {
                    const res = await fetch(GAS_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: "uploadFile",
                            base64Data: base64Data,
                            fileName: file.name,
                            mimeType: file.type
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        loadModelFromBase64(base64Data, file.name);
                        fetchFiles();
                    }
                } catch(err) {
                    statusDiv.innerHTML = '<span style="color:red;">上傳連線失敗。</span>';
                } finally {
                    uploadBtn.disabled = false;
                }
            };
        });
    </script>
</body>
</html>
